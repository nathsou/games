name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Spacegolf tests
        run: npm test
        working-directory: spacegolf
      - name: Flip it tests
        run: npm test
        working-directory: flip-it

  midnight-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Midnight Table rules and protocol tests
        run: npm test
        working-directory: midnight

  deploy:
    needs: [test, midnight-test]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/spacegolf _site/flip-it
          cp index.html _site/
          cp flip-it/index.html flip-it/style.css flip-it/preview.png _site/flip-it/
          cp -r flip-it/src flip-it/assets _site/flip-it/
          cp spacegolf/index.html spacegolf/preview.jpg _site/spacegolf/
          cp -r spacegolf/src _site/spacegolf/src
          mkdir -p _site/midnight
          cp midnight/index.html midnight/style.css midnight/preview.png _site/midnight/
          cp -r midnight/src midnight/assets _site/midnight/
          cp -r similo _site/similo
          cp -r shared _site/shared
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
