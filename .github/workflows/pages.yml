name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Spacegolf tests
        run: npm test
        working-directory: spacegolf
      - name: Nonocube install
        run: npm ci
        working-directory: nonocube
      - name: Nonocube type-check and tests
        run: npm run typecheck && npm test
        working-directory: nonocube

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Nonocube
        run: npm ci && npx vite build
        working-directory: nonocube
      - name: Assemble site
        run: |
          mkdir -p _site/spacegolf
          cp index.html _site/
          cp spacegolf/index.html spacegolf/preview.jpg _site/spacegolf/
          cp -r spacegolf/src _site/spacegolf/src
          cp -r nonocube/dist _site/nonocube
          cp nonocube/preview.jpg _site/nonocube/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
