<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#102e31">
  <meta name="description" content="A retro cooperative deduction game. Give visual clues, find the secret card, and compare your interpretations at the reveal. Play with a friend or a vision AI.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://openrouter.ai https://api.openai.com https://api.anthropic.com; font-src 'self'; object-src 'none'; base-uri 'self'">
  <title>Cluance — Same cards. Different minds.</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <canvas id="ambience" aria-hidden="true"></canvas>
  <div class="scanlines" aria-hidden="true"></div>
  <header class="topbar">
    <a class="wordmark" href="#" id="home-link"><span class="logo-mark">C<span>✦</span></span><span>CLUANCE<small>FIVE CLUES</small></span></a>
    <div class="top-actions"><span id="connection-badge" class="connection-badge" hidden></span><button id="sound-toggle" class="icon-button" aria-label="Mute background music" title="Mute music · keep sound effects">♪</button><button id="rules-button" class="quiet-button">How to play</button><button id="settings-button" class="quiet-button">Settings <span>↗</span></button></div>
  </header>
  <main id="app" tabindex="-1"></main>
  <footer class="footer"><span>A LITTLE TRUST. A LOT OF INTERPRETATION.</span><span>Original artwork · Inspired by Similo <a href="https://www.gigamic.com/blog/post/tout-sur-la-gamme-similo" target="_blank" rel="noopener noreferrer">↗</a></span></footer>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
